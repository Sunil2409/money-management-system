services:
  db:
    image: postgres:16-alpine
    container_name: money_manager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moneymanager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres 
      -c shared_buffers=32MB 
      -c work_mem=2MB 
      -c maintenance_work_mem=16MB 
      -c max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moneymanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 140M
        reservations:
          memory: 64M
    mem_limit: 140m
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    container_name: money_manager_redis
    restart: unless-stopped
    command: >
      redis-server 
      --maxmemory 48mb 
      --maxmemory-policy allkeys-lru 
      --save "" 
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M
        reservations:
          memory: 24M
    mem_limit: 64m
    networks:
      - internal_net

  backend:
    image: ${ECR_REGISTRY:-ghcr.io}/${ECR_REPOSITORY:-money-manager}:${IMAGE_TAG:-latest}
    container_name: money_manager_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 2
      --worker-class gthread
      --worker-tmp-dir /dev/shm
      --max-requests 1000
      --max-requests-jitter 100
      --timeout 60
      --access-logfile -
      --error-logfile -
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneymanager}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/api/health/\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 220M
        reservations:
          memory: 110M
    mem_limit: 220m
    volumes:
      - static_volume:/app/staticfiles
    networks:
      - internal_net

  celery_worker:
    image: ${ECR_REGISTRY:-ghcr.io}/${ECR_REPOSITORY:-money-manager}:${IMAGE_TAG:-latest}
    container_name: money_manager_celery
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Combines Celery Worker and Beat into a single process to save 90MB of RAM
    command: >
      celery -A config worker
      --beat
      --concurrency=1
      --loglevel=INFO
      --max-tasks-per-child=50
      --schedule=/tmp/celerybeat-schedule
    environment:
      DEBUG: "False"
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneymanager}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 160M
        reservations:
          memory: 80M
    mem_limit: 160m
    networks:
      - internal_net

  nginx:
    image: nginx:1.25-alpine
    container_name: money_manager_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - static_volume:/var/www/static:ro
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 32M
        reservations:
          memory: 16M
    mem_limit: 32m
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  postgres_data:
  static_volume: