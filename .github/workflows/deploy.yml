name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Critical: Grant id-token write permission for OIDC authentication
permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'money-manager' }}
  PYTHON_VERSION: '3.12'

jobs:
  # =========================================================================
  # Stage 1: Quality Gate & Static Application Security Testing (SAST)
  # =========================================================================
  lint-and-test:
    name: Lint, SAST & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_money_manager
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_money_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install bandit

      - name: Lint Code with Flake8
        run: |
          cd backend
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complexity and style check (uses .flake8 config for line length)
          flake8 . --count --max-complexity=10 --show-source --statistics

      - name: Run Bandit (Python SAST)
        run: |
          bandit -r backend/ -ll -ii -x backend/*/tests*,backend/*/migrations/*

      - name: Run Database Migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_money_manager
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Run PyTest with Coverage Gate
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "True"
          DB_ENGINE: django.db.backends.postgresql
          DB_NAME: test_money_manager
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: "5432"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
        run: |
          cd backend
          pytest -v --cov=. --cov-report=term-missing --cov-fail-under=80

  # =========================================================================
  # Stage 2: Container Build & Trivy Vulnerability Scanning
  # =========================================================================
  build-and-scan:
    name: Build & Security Scan Container
    needs: lint-and-test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Immutable Image Tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC (No Static Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-MoneyManager-Build

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Container Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security Gate: Fail pipeline on OS/library vulnerabilities with high severity
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Only push verified, scanned images if on main branch
      - name: Push Verified Container Image to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

  # =========================================================================
  # Stage 3: Automated Deployment via AWS SSM Run Command
  # =========================================================================
  deploy:
    name: Production Rollout via SSM
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Manifests
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-MoneyManager-Deploy

      - name: Deploy to EC2 via AWS SSM Run Command
        env:
          ECR_REGISTRY: ${{ needs.build-and-scan.outputs.ecr_registry }}
          IMAGE_TAG: ${{ needs.build-and-scan.outputs.image_tag }}
        run: |
          echo "Initiating zero-SSH deployment for image tag: $IMAGE_TAG"

          # 1. Update deployment compose file on EC2 via SSM Run Command
          # Passing command script dynamically with error traps and automated rollback
          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Project,Values=MoneyManager" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Money Manager SHA: $IMAGE_TAG" \
            --parameters commands='[
              "set -euo pipefail",
              "export HOME=/root",
              "cd /opt/moneymanager",
              
              "echo === 1. Authenticating to ECR ===",
              "aws ecr get-login-password --region '"$AWS_REGION"' | docker login --username AWS --password-stdin '"$ECR_REGISTRY"'",
              
              "echo === 2. Fetching Runtime Secrets from SSM Parameter Store ===",
              "POSTGRES_PASSWORD=$(aws ssm get-parameter --name /moneymanager/prod/POSTGRES_PASSWORD --with-decryption --query Parameter.Value --output text --region '"$AWS_REGION"')",
              "SECRET_KEY=$(aws ssm get-parameter --name /moneymanager/prod/SECRET_KEY --with-decryption --query Parameter.Value --output text --region '"$AWS_REGION"')",
              "JWT_SECRET_KEY=$(aws ssm get-parameter --name /moneymanager/prod/JWT_SECRET_KEY --with-decryption --query Parameter.Value --output text --region '"$AWS_REGION"')",
              
              "echo === 3. Writing Runtime Environment File ===",
              "cat << EOF > .env",
              "DEBUG=False",
              "POSTGRES_PASSWORD=$POSTGRES_PASSWORD",
              "SECRET_KEY=$SECRET_KEY",
              "JWT_SECRET_KEY=$JWT_SECRET_KEY",
              "ECR_REGISTRY='"$ECR_REGISTRY"'",
              "ECR_REPOSITORY='"$ECR_REPOSITORY"'",
              "IMAGE_TAG='"$IMAGE_TAG"'",
              "AWS_DEFAULT_REGION='"$AWS_REGION"'",
              "AWS_STORAGE_BUCKET_NAME=$(cat .app-env | grep AWS_STORAGE_BUCKET_NAME | cut -d= -f2)",
              "EOF",
              "chmod 600 .env",
              
              "echo === 4. Pulling Scanned Images ===",
              "docker compose -f docker-compose.prod.yml pull backend celery_worker",
              
              "echo === 5. Executing Rolling Recreate ===",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              
              "echo === 6. Verifying Healthcheck Endpoint ===",
              "HEALTHY=0",
              "for i in {1..12}; do",
              "  HTTP_STATUS=\$(curl -s -o /dev/null -w \"%{http_code}\" http://127.0.0.1:8000/api/health/ || true)",
              "  if [ \"\\$HTTP_STATUS\" = \"200\" ]; then",
              "    echo \"Deployment healthcheck verified: HTTP 200 OK\"",
              "    HEALTHY=1",
              "    break",
              "  fi",
              "  echo \"Waiting for service readiness (attempt \\$i/12)...\"",
              "  sleep 5",
              "done",
              
              "if [ \\$HEALTHY -ne 1 ]; then",
              "  echo \"[FATAL] Readiness check failed. Diagnostic logs:\"",
              "  docker compose -f docker-compose.prod.yml logs --tail=50 backend",
              "  exit 1",
              "fi",
              
              "echo === 7. Garbage Collecting Old Images ===",
              "docker image prune -af --filter \"until=48h\""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched. Command ID: $COMMAND_ID"

          # 2. Poll command status until execution finishes
          echo "Awaiting execution status..."
          STATUS="InProgress"
          while [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Pending" ]; do
            sleep 8
            STATUS=$(aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --query "Commands[0].Status" \
              --output text)
            echo "Current execution status: $STATUS"
          done

          # 3. Retrieve and print stdout/stderr diagnostics
          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query "CommandInvocations[*].CommandPlugins[*].Output" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM Deployment failed with terminal status: $STATUS"
            exit 1
          fi

          echo "Deployment successfully executed."
